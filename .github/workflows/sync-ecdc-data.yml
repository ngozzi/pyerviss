name: Sync ECDC data

on:
  schedule:
    # Daily; ECDC's update day and time vary. Commits only happen when data changes.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ecdc-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.0.0" "requests>=2.28.0"

      - name: Sync from ECDC
        run: python scripts/sync_ecdc.py --data-dir data --summary-file sync-summary.md

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes."
            exit 0
          fi
          cat sync-summary.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data sync: $(date -u +%Y-%m-%d)" -m "$(cat sync-summary.md)"
          git push
