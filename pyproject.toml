[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyerviss"
version = "0.1.0"
description = "Unofficial Python API for ERVISS (European Respiratory Virus Surveillance Summary) data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nicolo Gozzi", email = "nic.gozzi@gmail.com"},
]
keywords = ["epidemiology", "surveillance", "respiratory viruses", "ILI", "ARI", "SARI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "responses>=0.23.0",
    "types-requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/ngozzi/pyerviss"
Repository = "https://github.com/ngozzi/pyerviss"
Issues = "https://github.com/ngozzi/pyerviss/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyerviss"]

[tool.hatch.build.targets.sdist]
exclude = [
    "data/",
    "tests/",
    ".github/",
    ".gitignore",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=pyerviss",
    "--cov=scripts",
    "--cov-report=term-missing",
]
